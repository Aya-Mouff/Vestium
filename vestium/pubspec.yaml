name: vestium
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^7.8.4
  permission_handler: ^11.0.1
  camera: ^0.11.0+1
  path: ^1.8.3
  path_provider: ^2.1.2
  flutter_launcher_icons: ^0.10.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  image_picker: ^1.0.4
  photo_manager: ^3.8.2
  cached_network_image: ^3.3.0
  image: ^3.3.0
  focus_detector: ^2.0.0
  connectivity_plus: ^5.0.0  # Check internet connection
  http: ^1.1.0               # API calls
  shared_preferences: ^2.2.2 # Store tokens
  provider: ^6.1.1
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^15.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  auto_route_generator: ^7.3.2
  build_runner: ^2.4.6
  shared_preferences: ^2.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/logos/
    - assets/images/backgrounds/
    - assets/images/dummyData/
    - assets/images/icons/
    - assets/fonts/
    - assets/data/

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond/CormorantGaramond-Italic.ttf
          style: italic

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-ExtraLight.ttf
          weight: 200

    - family: AlexBrush
      fonts:
        - asset: assets/fonts/AlexBrush/AlexBrush-Regular.ttf
          weight: 400

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/logo.png"

